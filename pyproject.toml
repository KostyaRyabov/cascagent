[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cascagent"
version = "0.1.0"
description = "Multi-agent recursive task decomposition system for weak hardware (llama.cpp backend)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "cascagent contributors" }]
keywords = ["llm", "agents", "decomposition", "llama.cpp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "requests>=2.31",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "python-Levenshtein>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cascagent = "cascagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:libtmux"
